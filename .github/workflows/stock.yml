name: 0050 Stock Daily Notification

on:
  schedule:
    # 台灣時間 (UTC+8) 下午 13:45 測試
    # 對應 UTC 時間為 05:45 (每週一到週五: 1-5)
    - cron: '45 5 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動觸發測試

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝相依套件
        run: npm ci

      - name: 編譯 TypeScript
        run: npm run build

      - name: 執行股票通知腳本
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: npm start
